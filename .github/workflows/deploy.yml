name: Deploy Contract

# Manual trigger only — prevents accidental contract redeployment
# (each deploy creates a NEW contract address, breaking the frontend)
# Run this only when the contract code actually changes and needs redeployment.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "deploy" to confirm contract redeployment'
        required: true

jobs:
  deploy-contract:
    name: Deploy Smart Contract to Stellar Testnet
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.confirm == 'deploy' }}
    defaults:
      run:
        working-directory: contract

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.81
        with:
          targets: wasm32v1-none

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            contract/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('contract/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Install Stellar CLI
        run: cargo install stellar-cli --features opt --locked

      - name: Build contract (WASM)
        run: cargo build --target wasm32v1-none --release

      - name: Deploy contract to Testnet
        run: |
          stellar contract deploy \
            --wasm target/wasm32v1-none/release/contract.wasm \
            --network testnet \
            --source-account ${{ secrets.STELLAR_SECRET_KEY }}
        env:
          STELLAR_SECRET_KEY: ${{ secrets.STELLAR_SECRET_KEY }}

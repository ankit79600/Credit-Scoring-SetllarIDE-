name: Deploy Contract

# Manual trigger only — prevents accidental contract redeployment
# (each deploy creates a NEW contract address, breaking the frontend)
# Run this only when the contract code actually changes and needs redeployment.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "deploy" to confirm contract redeployment'
        required: true

jobs:
  deploy-contract:
    name: Deploy Smart Contract to Stellar Testnet
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.confirm == 'deploy' }}
    defaults:
      run:
        working-directory: contract

    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/stellar
            contract/target
          key: ${{ runner.os }}-deploy-stable-${{ hashFiles('contract/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-deploy-stable-

      - name: Install Stellar CLI
        run: |
          if ! command -v stellar &> /dev/null; then
            cargo install stellar-cli --locked
          fi

      - name: Build contract (WASM)
        run: stellar contract build

      - name: Deploy contract to Testnet
        env:
          STELLAR_SECRET_KEY: ${{ secrets.STELLAR_SECRET_KEY }}
        run: |
          stellar contract deploy \
            --wasm target/wasm32v1-none/release/contract.wasm \
            --network testnet \
            --source-account "$STELLAR_SECRET_KEY"
